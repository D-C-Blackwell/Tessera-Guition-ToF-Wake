# Merge this configuration into:
#   /config/esphome/<your-screen-name>.local.yaml
#
# Compile and install the main file afterwards:
#   /config/esphome/<your-screen-name>.yaml
#
# Preserve other local configuration, such as relay definitions.

logger:
  logs:
    # Keep warnings and errors without logging every ToF measurement.
    sensor: WARN
    vl53l0x: WARN

i2c:
  # Existing Tessera GT911 touchscreen bus, shared with the VL53L0X.
  - id: touch_bus
    sda: GPIO19
    scl:
      number: GPIO45
      ignore_strapping_warning: true
    scan: true
    frequency: 100kHz

binary_sensor:
  - platform: template
    id: screen_approach
    name: "Screen Approach"
    device_class: occupancy
    on_press:
      # Tessera's own local wake control.
      - button.press: wake_button

sensor:
  # The raw measurement stays on the screen. The filter publishes only changes
  # to Screen Approach, so Home Assistant is not sent every distance sample.
  - platform: vl53l0x
    id: screen_proximity_distance
    i2c_id: touch_bus
    address: 0x29
    update_interval: 500ms
    long_range: false
    timing_budget: 50ms
    timeout: 100ms
    internal: true
    filters:
      - lambda: |-
          static double minTripDistance = 1.0;

          if (x <= minTripDistance) {
            if (id(screen_approach).state == true) {
              return {};
            }

            id(screen_approach).publish_state(true);
            ESP_LOGI("screen_proximity", "Screen approach detected at %.3f m", x);
            return {};
          } else {
            if (id(screen_approach).state == false) {
              return {};
            }

            id(screen_approach).publish_state(false);
            ESP_LOGI("screen_proximity", "Screen approach cleared at %.3f m", x);
            return {};
          }

# Keep the display awake while somebody remains within the approach distance.
# Tessera resumes its normal standby behaviour after the sensor clears.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            binary_sensor.is_on: screen_approach
          then:
            - lambda: 'id(last_touch_ms) = millis();'
